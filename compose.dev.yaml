name: lexia-development

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    environment:
      NODE_ENV: development
      LEXIA_LOAD_ENV: "false"
      PORT: 3000
      PUBLIC_URL: http://localhost:3000
      DATABASE_URL: postgresql://lexia:lexia_dev@database:5432/lexia
      PGSSLMODE: disable
      AI_PROVIDER: local
      LEGAL_WEB_SEARCH_ENABLED: "false"
      LEXIA_RATE_LIMIT_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/workspace
      - backend_node_modules:/workspace/backend/node_modules
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lexia
      POSTGRES_USER: lexia
      POSTGRES_PASSWORD: lexia_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U lexia -d lexia
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backend_node_modules:
  postgres_data:
