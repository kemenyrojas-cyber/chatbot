services:
  - type: web_service
    name: lexia-backend
    env: node
    branch: main
    buildCommand: npm install --prefix backend
    startCommand: npm start --prefix backend
    plan: free
    envVars:
      - key: DATA_DIR
        value: /var/data
    disk:
      name: lexia-data
      mountPath: /var/data
      sizeGB: 1
