services:
  - type: web
    name: lexia-backend
    env: node
    branch: main
    buildCommand: npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lexia-db
          property: connectionString

databases:
  - name: lexia-db
    databaseName: lexia
    user: lexia
    plan: free
