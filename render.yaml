services:
  - type: web
    name: lexia-backend
    env: node
    branch: main
    buildCommand: npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require
      - key: AI_PROVIDER
        value: auto
      - key: LEXIA_PROVIDER_STRATEGY
        value: ensemble
      - key: AI_PROVIDER_TIMEOUT_MS
        value: "45000"
      - key: LEGAL_ALLOWED_SOURCE_HOSTS
        value: elperuano.pe,www.elperuano.pe,tc.gob.pe,www.tc.gob.pe,pj.gob.pe,www.pj.gob.pe,gob.pe,www.gob.pe,sunarp.gob.pe,www.sunarp.gob.pe,sunafil.gob.pe,www.sunafil.gob.pe,lpderecho.pe,www.lpderecho.pe
      - key: LEGAL_DISCOVERY_SEED_URLS
        value: https://elperuano.pe/derecho,https://www.tc.gob.pe/jurisprudencia/,https://www.gob.pe/busquedas?term=leyes,https://www.sunafil.gob.pe/noticias/,https://lpderecho.pe/laboral/
      - key: LEGAL_CURATOR_EMAILS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        value: qwen2.5:3b
      - key: OLLAMA_ENABLED
        value: "false"
      - key: OLLAMA_PREFER
        value: "false"
      - key: OLLAMA_KEEP_ALIVE
        value: 5m
      - key: OLLAMA_API_KEY
        sync: false
