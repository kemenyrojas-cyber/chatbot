services:
  - type: web
    name: lexia-backend
    env: docker
    branch: main
    plan: free
    envVars:
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require
      - key: AI_PROVIDER
        value: groq
      - key: LEXIA_PROVIDER_STRATEGY
        value: fallback
      - key: AI_PROVIDER_TIMEOUT_MS
        value: "45000"
      - key: LEXIA_PYTHON_BRAIN_ENABLED
        value: "true"
      - key: LEXIA_PYTHON_BRAIN_TIMEOUT_MS
        value: "2500"
      - key: LEXIA_OCR_LANGUAGES
        value: spa+eng
      - key: LEXIA_OCR_DPI
        value: "170"
      - key: LEXIA_LOCAL_OCR_CONCURRENCY
        value: "2"
      - key: LEXIA_LOCAL_OCR_GLOBAL_CONCURRENCY
        value: "2"
      - key: LEXIA_LOCAL_OCR_BATCH_PAGES
        value: "12"
      - key: LEGAL_ALLOWED_SOURCE_HOSTS
        value: elperuano.pe,www.elperuano.pe,tc.gob.pe,www.tc.gob.pe,pj.gob.pe,www.pj.gob.pe,gob.pe,www.gob.pe,sunarp.gob.pe,www.sunarp.gob.pe,sunafil.gob.pe,www.sunafil.gob.pe,lpderecho.pe,www.lpderecho.pe,estudioderechoylibertad.com,www.estudioderechoylibertad.com
      - key: LEGAL_DISCOVERY_SEED_URLS
        value: https://elperuano.pe/derecho,https://www.tc.gob.pe/jurisprudencia/,https://www.gob.pe/busquedas?term=leyes,https://www.sunafil.gob.pe/noticias/,https://lpderecho.pe/laboral/
      - key: LEGAL_WEB_SEARCH_ENABLED
        value: "true"
      - key: LEGAL_WEB_SEARCH_PROVIDERS
        value: brave,bing,google,serpapi
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: BING_SEARCH_API_KEY
        sync: false
      - key: BING_SEARCH_ENDPOINT
        value: https://api.bing.microsoft.com/v7.0/search
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_CX
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: LEGAL_CURATOR_EMAILS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        value: qwen2.5:3b
      - key: OLLAMA_ENABLED
        value: "false"
      - key: OLLAMA_PREFER
        value: "false"
      - key: OLLAMA_KEEP_ALIVE
        value: 5m
      - key: OLLAMA_API_KEY
        sync: false
