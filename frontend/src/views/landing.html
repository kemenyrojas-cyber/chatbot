<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEXIA - Asesor Legal Inteligente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ["Inter", "Segoe UI", "Arial", "sans-serif"] },
                    colors: {
                        ink: "#020B22",
                        navy: "#071B4A",
                        bluex: "#3267FF",
                        soft: "#7CA2FF"
                    },
                    boxShadow: {
                        glow: "0 24px 80px rgba(50,103,255,.22)",
                        card: "0 16px 48px rgba(9,22,58,.10)"
                    }
                }
            }
        };
    </script>
</head>
<body class="font-sans text-[15px] antialiased">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const navItems = ["Inicio", "Características", "Áreas del Derecho", "Planes", "Nosotros", "Contacto"];

        const areas = [
            ["scale", "Derecho Civil", "Personas, bienes, contratos y obligaciones.", "#2F6BFF"],
            ["gavel", "Derecho Penal", "Delitos, penas, procesos y defensas.", "#6D4AFF"],
            ["briefcase", "Derecho Laboral", "Trabajadores, empleadores, contratos y beneficios.", "#13B981"],
            ["landmark", "Derecho Comercial", "Empresas, sociedades, contratos y obligaciones.", "#E66B1F"],
            ["users", "Derecho de Familia", "Matrimonio, divorcio, alimentos, tenencia y más.", "#E64D84"],
            ["folder", "Procedimiento Legal", "Procesos, demandas, recursos y más.", "#7C9BFF"]
        ];

        const benefits = [
            ["shield", "Información confiable", "Basada en legislación peruana actualizada y fuentes oficiales."],
            ["clock", "Ahorra tiempo", "Obtén respuestas y análisis en segundos, no en horas."],
            ["brain", "Inteligencia avanzada", "IA entrenada en derecho peruano para respuestas precisas."],
            ["lock", "Seguro y privado", "Tus consultas son confidenciales y protegidas."]
        ];

        const logos = ["Estudio Jurídico Díaz & Asociados", "Municipalidad de Miraflores", "Universidad Nacional Mayor de San Marcos"];

        function Icon({ type, className = "h-8 w-8" }) {
            const props = { className, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "1.9", strokeLinecap: "round", strokeLinejoin: "round" };
            if (type === "scale") return <svg {...props}><path d="M12 3v18"/><path d="M5 6h14"/><path d="m6 6-3 7h6Z"/><path d="m18 6-3 7h6Z"/><path d="M8 21h8"/></svg>;
            if (type === "gavel") return <svg {...props}><path d="m14 13-7 7"/><path d="m8 6 10 10"/><path d="m11 3 10 10"/><path d="m2 21 5-5"/><path d="m5 9 4-4"/></svg>;
            if (type === "briefcase") return <svg {...props}><path d="M10 6V5a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v1"/><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 12h18"/><path d="M9 12v2h6v-2"/></svg>;
            if (type === "landmark") return <svg {...props}><path d="M3 21h18"/><path d="M5 10h14"/><path d="M6 10v8"/><path d="M10 10v8"/><path d="M14 10v8"/><path d="M18 10v8"/><path d="m12 3 8 4H4Z"/></svg>;
            if (type === "users") return <svg {...props}><path d="M16 21v-2a4 4 0 0 0-8 0v2"/><circle cx="12" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M2 21v-2a4 4 0 0 1 3-3.87"/></svg>;
            if (type === "folder") return <svg {...props}><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>;
            if (type === "zap") return <svg {...props}><path d="M13 2 4 14h7l-1 8 9-12h-7Z"/></svg>;
            if (type === "target") return <svg {...props}><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v4"/><path d="M12 18v4"/><path d="M2 12h4"/><path d="M18 12h4"/></svg>;
            if (type === "file") return <svg {...props}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h6"/></svg>;
            if (type === "grid") return <svg {...props}><rect x="4" y="4" width="4" height="4" rx="1"/><rect x="10" y="4" width="4" height="4" rx="1"/><rect x="16" y="4" width="4" height="4" rx="1"/><rect x="4" y="10" width="4" height="4" rx="1"/><rect x="10" y="10" width="4" height="4" rx="1"/><rect x="16" y="10" width="4" height="4" rx="1"/><rect x="4" y="16" width="4" height="4" rx="1"/><rect x="10" y="16" width="4" height="4" rx="1"/><rect x="16" y="16" width="4" height="4" rx="1"/></svg>;
            if (type === "shield") return <svg {...props}><path d="M12 3 5 6v6c0 4.4 2.8 7.5 7 9 4.2-1.5 7-4.6 7-9V6l-7-3Z"/><path d="m9 12 2 2 4-5"/></svg>;
            if (type === "clock") return <svg {...props}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>;
            if (type === "brain") return <svg {...props}><path d="M9 4a3 3 0 0 0-3 3v1a3 3 0 0 0 0 6v1a3 3 0 0 0 5 2.2V4.8A3 3 0 0 0 9 4Z"/><path d="M15 4a3 3 0 0 1 3 3v1a3 3 0 0 1 0 6v1a3 3 0 0 1-5 2.2V4.8A3 3 0 0 1 15 4Z"/></svg>;
            return <svg {...props}><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>;
        }

        function AreaIcon({ type, className = "text-4xl" }) {
            const icons = {
                scale: "fa-solid fa-scale-balanced",
                gavel: "fa-solid fa-gavel",
                briefcase: "fa-solid fa-briefcase",
                landmark: "fa-solid fa-building-columns",
                users: "fa-solid fa-users",
                folder: "fa-solid fa-folder"
            };
            return <i className={`${icons[type]} ${className}`} aria-hidden="true"></i>;
        }

        function BenefitIcon({ type, className = "text-3xl" }) {
            const icons = {
                shield: "fa-solid fa-shield-halved",
                clock: "fa-solid fa-clock",
                brain: "fa-solid fa-brain",
                lock: "fa-solid fa-lock"
            };
            return <i className={`${icons[type]} ${className}`} aria-hidden="true"></i>;
        }

        function App() {
            return (
                <main className="min-h-screen bg-white text-slate-950">
                    <section className="relative overflow-hidden bg-[radial-gradient(circle_at_68%_30%,rgba(50,103,255,.22),transparent_34%),linear-gradient(180deg,#020B22_0%,#071B4A_100%)] text-white">
                        <div className="absolute inset-0 opacity-[.12] [background-image:linear-gradient(90deg,transparent_0,transparent_9%,rgba(255,255,255,.14)_9.2%,transparent_9.4%),linear-gradient(rgba(255,255,255,.08)_1px,transparent_1px)] [background-size:120px_100%,100%_72px]"></div>
                        <div className="relative mx-auto max-w-[1280px] px-6 pb-6 pt-5 lg:px-8">
                            <nav className="flex items-center justify-between">
                                <a href="#" className="flex flex-col items-start gap-1">
                                    <span className="w-full text-center text-3xl font-extrabold tracking-tight">LEXIA</span>
                                    <span className="sr-only">LEXIA</span>
                                    <span className="hidden text-xs font-medium text-slate-300 sm:block">Asesor Legal Inteligente con IA</span>
                                </a>

                                <div className="hidden items-center gap-8 text-[15px] font-medium text-white/90 lg:flex">
                                    {navItems.map((item, index) => (
                                        <a key={item} href="#" className={index === 0 ? "border-b-2 border-bluex pb-3 text-soft" : "pb-3 transition hover:text-soft"}>
                                            {item}
                                        </a>
                                    ))}
                                </div>

                                <div className="flex items-center gap-4">
                                    <a href="/login" className="hidden rounded-md border border-soft/60 px-6 py-3 text-sm font-semibold text-white transition hover:bg-white/8 sm:inline-flex">Iniciar sesión</a>
                                    <a href="/registro" className="rounded-md bg-bluex px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-blue-900/30 transition hover:bg-blue-500">Registrarse</a>
                                </div>
                            </nav>

                            <div className="grid min-h-[620px] items-center gap-8 pt-8 lg:grid-cols-[.9fr_1.1fr]">
                                <div className="max-w-[620px]">
                                    <div className="mb-5 inline-flex rounded-full border border-bluex px-4 py-1.5 text-xs font-semibold uppercase tracking-wide text-soft">
                                        Inteligencia artificial al servicio del derecho
                                    </div>
                                    <h1 className="text-5xl font-extrabold leading-[1.05] tracking-tight sm:text-6xl">
                                        Tu asesor legal inteligente, <span className="text-bluex">siempre a tu lado.</span>
                                    </h1>
                                    <p className="mt-5 max-w-[520px] text-base leading-7 text-slate-300">
                                        LEXIA utiliza inteligencia artificial para brindarte respuestas precisas, análisis legales y herramientas profesionales en segundos. Ahorra tiempo, trabaja mejor, toma decisiones con confianza.
                                    </p>

                                    <div className="mt-7 flex max-w-[560px] items-center rounded-md bg-white p-2 shadow-glow">
                                        <input className="min-h-12 flex-1 rounded-md px-4 text-sm text-slate-900 outline-none placeholder:text-slate-400" placeholder="Haz tu consulta legal aquí..." />
                                        <button className="grid h-11 w-11 place-items-center rounded-full bg-[#0A1737] text-white transition hover:bg-bluex">
                                            <svg viewBox="0 0 24 24" className="h-5 w-5" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
                                        </button>
                                    </div>

                                    <div className="mt-5 flex max-w-[640px] items-center gap-2 text-[11px] text-slate-300">
                                        <span className="pt-1.5">Ejemplos:</span>
                                        <div className="flex flex-nowrap items-center gap-1.5">
                                            <span className="whitespace-nowrap rounded-full border border-white/10 bg-white/5 px-2.5 py-1.5">¿Cómo demandar por alimentos?</span>
                                            <span className="whitespace-nowrap rounded-full border border-white/10 bg-white/5 px-2.5 py-1.5">¿Qué es la nulidad de contrato?</span>
                                            <span className="whitespace-nowrap rounded-full border border-white/10 bg-white/5 px-2.5 py-1.5">Plazo de prescripción penal</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="relative h-[590px]">
                                    <img src="robot.png.png" alt="Robot legal de LEXIA" className="absolute left-1/2 top-[40%] z-20 h-[510px] w-[510px] -translate-x-1/2 -translate-y-1/2 object-contain drop-shadow-[0_34px_68px_rgba(0,0,0,.48)]" />

                                    <div className="absolute left-[2%] top-[18%] z-30 flex items-center gap-3 rounded-lg border border-white/12 bg-white/8 px-5 py-4 text-sm shadow-glow backdrop-blur-md">
                                        <span className="text-bluex"><Icon type="zap" className="h-8 w-8" /></span><span><strong>Respuestas</strong><br/><span className="text-slate-300">al instante</span></span>
                                    </div>
                                    <div className="absolute right-[2%] top-[18%] z-30 flex items-center gap-3 rounded-lg border border-white/12 bg-white/8 px-5 py-4 text-sm shadow-glow backdrop-blur-md">
                                        <span className="text-bluex"><Icon type="target" className="h-8 w-8" /></span><span><strong>Análisis</strong><br/><span className="text-slate-300">precisos</span></span>
                                    </div>
                                    <div className="absolute left-[-4%] top-[38%] z-30 flex items-center gap-3 rounded-lg border border-white/12 bg-white/8 px-5 py-4 text-sm shadow-glow backdrop-blur-md">
                                        <span className="text-bluex"><Icon type="file" className="h-8 w-8" /></span><span><strong>Normas</strong><br/><span className="text-slate-300">actualizadas</span></span>
                                    </div>
                                    <div className="absolute right-[-4%] top-[38%] z-30 flex items-center gap-3 rounded-lg border border-white/12 bg-white/8 px-5 py-4 text-sm shadow-glow backdrop-blur-md">
                                        <span className="text-bluex"><Icon type="landmark" className="h-8 w-8" /></span><span><strong>Jurisprudencia</strong><br/><span className="text-slate-300">confiable</span></span>
                                    </div>

                                    <div className="absolute bottom-0 left-1/2 z-30 grid w-[84%] -translate-x-1/2 grid-cols-4 rounded-xl border border-white/10 bg-white/5 py-5 text-center shadow-glow backdrop-blur-md">
                                        {[
                                            ["100K+", "Consultas realizadas"],
                                            ["50K+", "Usuarios activos"],
                                            ["98%", "Satisfacción de usuarios"],
                                            ["24/7", "Disponible para ti"]
                                        ].map(([value, label], index) => (
                                            <div key={label} className={index ? "border-l border-white/10 px-4" : "px-4"}>
                                                <p className="text-3xl font-extrabold text-soft">{value}</p>
                                                <p className="mt-1 text-sm leading-5 text-white">{label}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section className="bg-white px-6 py-7 lg:px-10">
                        <div className="mx-auto max-w-[1280px]">
                            <h2 className="text-center text-2xl font-extrabold text-[#071244]">Explora todas las áreas del Derecho</h2>
                            <div className="mt-6 grid gap-5 md:grid-cols-3 xl:grid-cols-6">
                                {areas.map(([icon, title, text, color]) => (
                                    <article key={title} className="rounded-lg border border-slate-200 bg-white px-5 py-6 text-center shadow-card">
                                        <div className="mx-auto mb-3 flex h-10 items-center justify-center" style={{ color }}><AreaIcon type={icon} /></div>
                                        <h3 className="font-semibold text-[#071244]">{title}</h3>
                                        <p className="mt-2 min-h-[48px] text-sm leading-5 text-slate-500">{text}</p>
                                        <a href="#" className="mt-4 inline-flex items-center gap-2 text-sm font-bold text-bluex">Explorar <span>→</span></a>
                                    </article>
                                ))}
                            </div>
                        </div>
                    </section>

                    <section className="bg-white px-6 pb-8 lg:px-10">
                        <div className="mx-auto grid max-w-[1280px] gap-8 border-t border-slate-200 pt-7 lg:grid-cols-[1.35fr_.65fr]">
                            <div>
                                <h2 className="text-2xl font-extrabold text-[#071244]">¿Por qué elegir LEXIA?</h2>
                                <div className="mt-5 grid gap-5 sm:grid-cols-2 xl:grid-cols-4">
                                    {benefits.map(([icon, title, text]) => (
                                        <article key={title} className="flex gap-4">
                                            <span className="flex-none text-soft"><BenefitIcon type={icon} /></span>
                                            <div>
                                                <h3 className="font-semibold text-[#071244]">{title}</h3>
                                                <p className="mt-1 text-sm leading-6 text-slate-500">{text}</p>
                                            </div>
                                        </article>
                                    ))}
                                </div>
                            </div>

                            <aside className="rounded-lg border border-slate-200 bg-white p-7 shadow-card">
                                <h3 className="font-extrabold text-[#071244]">Confían en nosotros</h3>
                                <div className="mt-6 grid grid-cols-3 items-center gap-4 text-center text-[11px] font-bold leading-4 text-slate-600">
                                    {logos.map((logo) => <div key={logo}>{logo}</div>)}
                                </div>
                            </aside>
                        </div>
                    </section>

                    <section className="bg-white px-6 pb-8 lg:px-10">
                        <div className="mx-auto flex max-w-[1280px] flex-col items-start justify-between gap-5 rounded-lg bg-[#03113A] px-8 py-7 text-white shadow-card md:flex-row md:items-center">
                            <div className="flex items-center gap-5">
                                <span className="grid h-16 w-16 place-items-center rounded-full bg-white/10 text-white"><i className="fa-solid fa-scale-balanced text-3xl" aria-hidden="true"></i></span>
                                <div>
                                    <h2 className="text-xl font-extrabold">Comienza a potenciar tu práctica legal hoy</h2>
                                    <p className="mt-1 text-sm text-slate-300">Únete a miles de abogados y estudiantes que ya confían en LEXIA.</p>
                                </div>
                            </div>
                            <div className="flex gap-4">
                                <a href="#" className="rounded-md border border-bluex px-8 py-3 text-sm font-bold">Conocer más</a>
                                <a href="/registro" className="rounded-md bg-bluex px-8 py-3 text-sm font-bold">Registrarse gratis →</a>
                            </div>
                        </div>
                    </section>
                </main>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
